<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Little Universe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Trebuchet MS',sans-serif;}
body{
  background:linear-gradient(180deg,#FFD8EB,#EADFFF,#D8F0FF);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}
.card{
  width:340px;
  background:rgba(255,255,255,.95);
  border-radius:35px;
  padding:30px;
  text-align:center;
  box-shadow:0 20px 45px rgba(255,105,180,.25);
}
.castle{font-size:70px;margin-bottom:10px;}
.badge{
  display:inline-block;
  background:#EC4899;
  color:white;
  padding:7px 14px;
  border-radius:30px;
  font-size:12px;
  margin-bottom:18px;
}
h1{
  color:#BE185D;
  margin-bottom:10px;
}
p{
  color:#6B7280;
  margin:8px 0;
  line-height:1.5;
}
button{
  width:100%;
  margin-top:20px;
  background:#EC4899;
  color:white;
  border:none;
  padding:16px;
  border-radius:18px;
  font-size:16px;
  font-weight:bold;
}
  .gate-button{
  display:block;
  width:100%;
  margin-top:20px;
  background:#EC4899;
  color:white;
  text-decoration:none;
  padding:16px;
  border-radius:18px;
  font-size:16px;
  font-weight:bold;
  text-align:center;
}
.hearts{
  position:absolute;
  top:20px;
  width:100%;
  text-align:center;
  font-size:24px;
}
.cloud{
  position:absolute;
  font-size:35px;
  opacity:.8;
  animation:float 12s linear infinite;
}

.cloud.one{top:90px;left:-60px;}
.cloud.two{top:170px;right:-40px;animation-duration:16s;}

.star{
  position:absolute;
  color:white;
  animation:twinkle 2s infinite alternate;
}

.star.s1{top:70px;left:60px;}
.star.s2{top:130px;right:70px;}
.star.s3{bottom:120px;left:80px;}

@keyframes float{
  from{transform:translateX(-40px);}
  to{transform:translateX(420px);}
}

@keyframes twinkle{
  from{opacity:.3;transform:scale(.8);}
  to{opacity:1;transform:scale(1.2);}
}
</style>
</head>
<body>
<div class="hearts">🎀 ☁️ ⭐ 🌸 ☁️ 🎀</div>
<div class="cloud one">☁️</div>
<div class="cloud two">☁️</div>

<div class="star s1">⭐</div>
<div class="star s2">✨</div>
<div class="star s3">⭐</div>
  <div class="card">
<div class="badge">Princess 👑 × Guardian 🛡️</div>

background:#DCFCE7;
color:#166534;
padding:10px;
border-radius:16px;
margin-bottom:18px;
font-size:14px;
font-weight:bold;">
🟢 Guardian Connected
</div>
<div class="castle">🏰</div>
<h1>Our Little Universe</h1>
<p>Welcome home, Princess Echa & Guardian Ian.</p>
<p>Grand Opening</p>
<h2 style="color:#2563EB;">17 September 2026 ✨</h2>
<a href="princess-admin.html" class="gate-button">🔒 Open The Gate</a>
<p style="font-size:12px;margin-top:18px;color:#9CA3AF;">Made with love by Princess Echa 🤍</p>
</div>
  
  
</body>
</html>
