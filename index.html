<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Little Universe</title>
<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#FFD9EC,#E8E4FF,#D7EEFF);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}
.card{
background:white;
width:320px;
padding:30px;
border-radius:28px;
text-align:center;
box-shadow:0 12px 30px rgba(0,0,0,.15);
}
.badge{
background:#EC4899;
color:white;
padding:6px 14px;
border-radius:20px;
display:inline-block;
font-size:12px;
}
h1{color:#BE185D;}
p{color:#666;}
button{
background:#EC4899;
color:white;
border:none;
padding:14px 20px;
border-radius:18px;
font-size:15px;
margin-top:18px;
}
</style>
</head>
<body>
<div class="card">
<div class="badge">Princess ♥ Guardian</div>
<h1>🏰 Our Little Universe</h1>
<p>Welcome home, Princess Echa & Guardian Ian.</p>
<p>Grand Release — 17 September 2026 ✨</p>
<button>🔒 Open The Gate</button>
</div>
</body>
</html>
